name: Bot safety tests

on:
  push:
    branches: [main]
    paths:
      - "server/bot/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/bot-tests.yml"
  pull_request:
    paths:
      - "server/bot/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/bot-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run bot:test
